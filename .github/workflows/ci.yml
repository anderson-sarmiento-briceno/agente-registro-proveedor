name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias (exactas, según uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Formato (ruff)
        run: uv run ruff format --check .

      - name: Tipos (mypy)
        run: uv run mypy src

      - name: Pruebas (pytest)
        run: uv run pytest

      - name: Validación de datos (falla solo con errores, no con sugerencias)
        run: uv run python scripts/validar_datos.py

      - name: Demostración sin modelo de lenguaje (los 4 casos, sin clave)
        run: uv run python scripts/demo.py
