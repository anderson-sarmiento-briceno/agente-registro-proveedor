<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro como Proveedor</title>
<style>
  :root { --fondo:#f6f7f9; --panel:#fff; --texto:#1d2330; --suave:#5d6579; --borde:#dfe3ea; --acento:#2350c8; --codigo:#eef1f8; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#14161b; --panel:#1c1f26; --texto:#e6e8ee; --suave:#9aa3b5; --borde:#2e333d; --acento:#7ea2ff; --codigo:#262a33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font:17px/1.65 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .layout { display:flex; max-width:1400px; margin:0 auto; }
  nav { position:sticky; top:0; height:100vh; overflow-y:auto; width:300px; flex-shrink:0; padding:24px 16px; border-right:1px solid var(--borde); font-size:14px; }
  nav b { display:block; margin-bottom:10px; color:var(--suave); text-transform:uppercase; font-size:12px; letter-spacing:.05em; }
  nav a { display:block; padding:4px 8px; color:var(--texto); text-decoration:none; border-radius:6px; }
  nav a:hover { background:var(--codigo); }
  nav a.h3 { padding-left:22px; color:var(--suave); font-size:13px; }
  main { flex:1; min-width:0; padding:32px 48px 80px; }
  article { background:var(--panel); border:1px solid var(--borde); border-radius:12px; padding:32px 40px; }
  h1 { font-size:30px; margin-top:0; } h2 { font-size:24px; margin-top:44px; padding-top:12px; border-top:2px solid var(--borde); }
  h3 { font-size:19px; margin-top:28px; color:var(--acento); }
  table { border-collapse:collapse; width:100%; margin:14px 0; font-size:15px; display:block; overflow-x:auto; }
  th, td { border:1px solid var(--borde); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:var(--codigo); } tr:nth-child(even) td { background:color-mix(in srgb, var(--codigo) 40%, transparent); }
  code { background:var(--codigo); padding:1px 5px; border-radius:4px; font-size:.9em; }
  pre { background:var(--codigo); padding:14px; border-radius:8px; overflow-x:auto; font-size:13px; line-height:1.4; }
  pre code { background:none; padding:0; }
  blockquote { margin:14px 0; padding:8px 16px; border-left:4px solid var(--acento); background:var(--codigo); border-radius:0 8px 8px 0; }
  a { color:var(--acento); }
  @media (max-width: 900px) { nav { display:none; } main { padding:16px; } article { padding:20px 16px; } }
</style>
</head>
<body>
<div class="layout">
  <nav id="indice"><b>Índice</b></nav>
  <main><article id="contenido">Cargando…</article></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const md = "# Agente · Registro como Proveedor\n\nUn agente de IA que prepara el **registro de una empresa como proveedor** ante sus clientes.\nEl cliente envía su formulario (Excel, PDF o un portal web) y la lista de documentos que\nexige. El agente lo llena con los datos del repositorio maestro de la empresa, revisa los\nsoportes (vigentes, por vencer, vencidos o ausentes) y arma el paquete para firma. Además,\ndice con claridad qué falta.\n\n**Demo en vivo:** <https://agente-registro-proveedor-yu72.onrender.com>.\nUsa datos de una empresa ficticia («Empresa Ejemplo S.A.S.») y cuatro casos de ejemplo:\nColombia, Ecuador, Honduras y Panamá. La primera visita puede tardar cerca de un minuto,\nporque el servidor gratuito se apaga cuando nadie lo usa.\n\n## Cómo funciona, en una frase\n\nEl modelo de lenguaje **decide qué herramienta usar y conversa**. Los valores, las reglas\ny las validaciones las hace **código**: ningún valor se inventa, lo sensible sale\nenmascarado y nada se confirma ni se envía sin que una persona pulse **Aprobar**.\n\nPara un caso completo, el modelo pide las herramientas en este orden:\n\n```\nproveedor_listar_casos → proveedor_leer_solicitud → proveedor_mapear_campos\n  → proveedor_generar_formulario → proveedor_armar_paquete\n  (con aprobación: proveedor_confirmar_campo, proveedor_registrar_envio)\n```\n\n## Probarlo en su computador\n\nRequisitos: [Git](https://git-scm.com/downloads) y\n[uv](https://docs.astral.sh/uv/getting-started/installation/). uv instala Python solo.\n\n```\ngit clone https://github.com/anderson-sarmiento-briceno/agente-registro-proveedor.git\ncd agente-registro-proveedor\nuv sync\nuv run python scripts/demo.py --llamadas     # los 4 casos, SIN modelo y sin clave\n```\n\nPara el chat con el modelo, copie `.env.example` como `.env` y ponga su clave de Anthropic\nen `ANTHROPIC_API_KEY`. Luego:\n\n```\nuv run uvicorn registro_proveedor.api.app:app    # http://127.0.0.1:8000\ndocker compose up --build                        # o lo mismo en un contenedor\n```\n\n## Usarlo desde Claude Desktop o Claude Code (MCP)\n\nLas herramientas también se publican como **servidor MCP**, para usarlas desde otras\nplataformas de agentes, sin la página ni la clave de Anthropic. Hay dos formas:\n\n- **Sin instalar nada:** en Claude, *Configuración → Conectores → Agregar conector\n  personalizado*, con la URL `https://agente-registro-proveedor-yu72.onrender.com/mcp`.\n- **En su computador:** descargando el proyecto en ZIP (sin Git) e instalando uv.\n\nLa guía paso a paso de las dos está en **[modulo/LEEME.md](modulo/LEEME.html)**. En esa\ncarpeta también están las instrucciones del agente (`agent.md`) y el conocimiento del\nproceso (`SKILL.md`).\n\n## Documentación\n\n| Archivo | Qué tiene |\n|---|---|\n| [PLAN-agente-registro-proveedor.md](PLAN-agente-registro-proveedor.html) | El problema, el alcance, las reglas de negocio, la arquitectura y los riesgos |\n| [SOLUCION.md](SOLUCION.html) | Cómo se construyó paso a paso, las decisiones tomadas, las pruebas, las evaluaciones y el diseño para escalar |\n| [modulo/LEEME.md](modulo/LEEME.html) | Cómo instalar el servidor MCP |\n\n## Calidad\n\n```\nuv run pytest                                   # más de 600 pruebas, sin red\nuv run ruff check . ; uv run mypy src           # estilo y tipos estrictos\n```\n\nEl CI de GitHub Actions corre todo esto en cada cambio. Las evaluaciones con el modelo\nreal (`scripts/evaluar.py`) se corren a mano, porque gastan dinero, y sus reportes quedan\nen `evals/reportes/`.\n\nHecho con Python 3.13, FastAPI, Pydantic, el SDK de Anthropic (`claude-haiku-5-5`) y el\nSDK de MCP.\n";
  const contenido = document.getElementById("contenido");
  contenido.innerHTML = window.marked ? marked.parse(md) : "<pre>" + md.replace(/[&<]/g, c => c === "&" ? "&amp;" : "&lt;") + "</pre>";
  const indice = document.getElementById("indice");
  contenido.querySelectorAll("h2, h3").forEach((h, i) => {
    h.id = "s" + i;
    const a = document.createElement("a");
    a.href = "#s" + i;
    a.textContent = h.textContent;
    a.className = h.tagName.toLowerCase();
    indice.appendChild(a);
  });
</script>
</body>
</html>
